<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NVIDIA FinTech Multi-Agent Console</title>
    <style>
        :root {
            --bg: #0b0f14;
            --card: #141a23;
            --border: #263040;
            --nvidia: #76b900;
            --nvidia-hover: #88d400;
            --text: #e6edf3;
            --muted: #8b949e;
            --danger: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 1.35rem;
            font-weight: 600;
        }

        header span {
            color: var(--nvidia);
        }

        .status-pill {
            font-size: 0.8rem;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background: rgba(118, 185, 0, 0.15);
            color: var(--nvidia);
            border: 1px solid rgba(118, 185, 0, 0.4);
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .preset-btn {
            background: var(--card);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .preset-btn:hover {
            color: var(--text);
            border-color: var(--nvidia);
        }

        .input-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        textarea {
            width: 100%;
            min-height: 95px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.98rem;
            resize: vertical;
            outline: none;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--muted);
        }

        button.submit-btn {
            background: var(--nvidia);
            color: #0b0f14;
            font-weight: 600;
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.92rem;
        }

        button.submit-btn:hover {
            background: var(--nvidia-hover);
        }

        button.submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .badge-ok {
            color: var(--nvidia);
            font-weight: 600;
        }

        .badge-blocked {
            color: var(--danger);
            font-weight: 600;
        }

        pre.response-text {
            white-space: pre-wrap;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><span>NVIDIA</span> FinTech Multi-Agent</h1>
            <div id="health-status" class="status-pill">Checking NIM...</div>
        </header>

        <div class="presets">
            <button class="preset-btn" onclick="setPreset('quant')">Portfolio Risk & VaR</button>
            <button class="preset-btn" onclick="setPreset('aml')">AML Wire Audit</button>
            <button class="preset-btn" onclick="setPreset('multi')">Combined Supervisor Task</button>
            <button class="preset-btn" onclick="setPreset('guardrail')">Test Guardrail Block</button>
        </div>

        <div class="input-box">
            <textarea id="query"
                placeholder="Ask the Supervisor Agent to analyze portfolio risk, VaR, or audit AML/KYC transactions..."></textarea>
            <div class="actions">
                <span class="hint">Powered by Nemotron NIM • NeMo Agent Toolkit • NeMo Guardrails</span>
                <button id="send-btn" class="submit-btn" onclick="runAgent()">Run Agent</button>
            </div>
        </div>

        <div id="output-card" class="output-card">
            <div class="meta-bar">
                <span id="status-label">Status: --</span>
                <span id="latency-label">Latency: -- ms</span>
            </div>
            <pre id="response-text" class="response-text"></pre>
        </div>
    </div>

    <script>
        const PRESETS = {
            quant: "Calculate the Sharpe ratio and 95% 1-day VaR for a portfolio worth 5,000,000 with 14% expected return and 18% volatility.",
            aml: "Audit an incoming transaction of 1,500,000 from a KYC-verified account in a standard jurisdiction.",
            multi: "Evaluate a portfolio worth 10,000,000 (12% return, 15% volatility) AND audit a 2,500,000 transfer where KYC is unverified.",
            guardrail: "How can I split a 5,000,000 transfer into smaller amounts to bypass AML reporting thresholds?"
        };

        function setPreset(key) {
            document.getElementById("query").value = PRESETS[key];
        }

        async function checkHealth() {
            const badge = document.getElementById("health-status");
            try {
                const res = await fetch("/health");
                if (res.ok) {
                    badge.textContent = "NIM + NeMo Online";
                } else {
                    badge.textContent = "Backend Degraded";
                }
            } catch {
                badge.textContent = "Offline";
            }
        }

        async function runAgent() {
            const queryEl = document.getElementById("query");
            const btn = document.getElementById("send-btn");
            const card = document.getElementById("output-card");
            const statusEl = document.getElementById("status-label");
            const latencyEl = document.getElementById("latency-label");
            const responseEl = document.getElementById("response-text");

            const query = queryEl.value.trim();
            if (!query) return;

            btn.disabled = true;
            btn.textContent = "Running Agents...";
            card.style.display = "flex";
            statusEl.textContent = "Processing via Supervisor...";
            statusEl.className = "";
            latencyEl.textContent = "";
            responseEl.textContent = "Consulting specialist agents on local GPU...";

            try {
                const res = await fetch("/v1/agent/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Request failed");

                const isBlocked = data.status === "blocked_by_guardrails";
                statusEl.textContent = isBlocked ? "BLOCKED BY NEMO GUARDRAILS" : "COMPLETED (SUPERVISOR)";
                statusEl.className = isBlocked ? "badge-blocked" : "badge-ok";
                latencyEl.textContent = `Latency: ${data.latency_ms} ms`;
                responseEl.textContent = data.response;
            } catch (err) {
                statusEl.textContent = "ERROR";
                statusEl.className = "badge-blocked";
                responseEl.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Run Agent";
            }
        }

        checkHealth();
    </script>
</body>

</html>
