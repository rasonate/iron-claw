[project]
name = "agentic-cart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.0",
    "langchain>=1.5.2",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.22",
    "llama-index>=0.14.26",
    "llama-index-embeddings-clip>=0.8.0",
    "llama-index-tools-mcp>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.11.0",
    "mcp[cli]>=2.3.0",
    "nemoguardrails>=0.25.0",
    "nvidia-nat>=1.9.0",
    "ollama>=0.6.3",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-cart = "agentic_cart:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
