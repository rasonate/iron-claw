[project]
name = "agentic-cart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "diskcache>=5.6.3",
    "fastapi[standard]>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.22",
    "llama-index>=0.14.26",
    "llama-index-embeddings-clip>=0.8.0",
    "llama-index-vector-stores-qdrant>=0.11.0",
    "nemoguardrails>=0.25.0",
    "numpy>=2.5.4",
    "nvidia-nat[a2a,eval,gunicorn,langchain,mcp,profiler]>=1.9.0",
    "ollama>=0.6.3",
    "pandas>=2.3.3",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.2.0",
    "pytest>=9.2.0",
    "qdrant-client>=1.20.0",
    "respx>=0.23.1",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.8.0",
]

[project.entry-points."nat.plugins"]
agentic_cart_tools = "agentic_cart.tools"
agentic_cart_rag_tools = "agentic_cart.rag_tools"

[project.scripts]
agentic-cart = "agentic_cart:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
